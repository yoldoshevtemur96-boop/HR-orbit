services:
  - type: web
    name: hr-orbit-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # NODE_ENV=production bo'lsa npm install devDependencies'ni
      # o'tkazib yuboradi (typescript/tsc-alias/@types/* shu yerda) —
      # bu build'ni buzadi. Shu bayroq npm'ga buni majburlab o'rnatishni
      # buyuradi.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://hr-orbit-nu.vercel.app
